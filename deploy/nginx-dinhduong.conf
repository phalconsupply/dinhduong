# Cấu hình nginx cho ứng dụng Dinh Dưỡng
#
# Các chỗ cần thay khi dùng:
#   __DOMAIN__     tên miền, ví dụ dinhduong.example.vn
#   __ROOT__       đường dẫn dự án, ví dụ /var/www/dinhduong
#   __PHP_SOCK__   socket PHP-FPM, ví dụ /run/php/php8.3-fpm.sock

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __ROOT__/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;          # đủ cho ảnh tải lên (form giới hạn 2MB)

    # Ẩn phiên bản nginx và vài header bảo mật cơ bản
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/dinhduong.access.log;
    error_log  /var/log/nginx/dinhduong.error.log;

    # ── Định tuyến của Laravel (tương đương public/.htaccess) ──
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── BẢO MẬT: cấm chạy PHP trong các thư mục người dùng tải file lên ──
    #
    # Ứng dụng cho tải ảnh lên và có CKFinder quản lý file, nên nếu ai đó đẩy
    # được file .php vào đây mà nginx đem đi thực thi thì coi như mất máy chủ.
    #
    # Bản Apache cũ có public/admin-assets/.../userfiles/.htaccess định chặn
    # việc này, nhưng nó bọc trong <IfModule mod_php5.c> nên TỪ LÂU ĐÃ VÔ HIỆU
    # trên PHP 8 chạy qua FPM. Ở đây chặn thật.
    location ~* ^/(uploads|admin-assets/libs/ckfinder_old/userfiles|admin-assets/libs/ckfinder/userfiles)/.*\.(php|php\d|phtml|phar|pl|py|cgi|sh)$ {
        deny all;
        return 403;
    }

    # Thư mục cache nội bộ của CKFinder — không phục vụ ra ngoài
    location ~* /\.ckfinder/ {
        deny all;
        return 403;
    }

    # Chặn mọi file ẩn (.env, .git, .htaccess…)
    location ~ /\. {
        deny all;
        return 403;
    }

    # ── PHP ──
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:__PHP_SOCK__;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 300;      # lệnh import WHO qua web có thể lâu
        fastcgi_hide_header X-Powered-By;
    }

    # ── Cache tài nguyên tĩnh ──
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
